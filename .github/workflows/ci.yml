name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://portal_fumep:portal_fumep@127.0.0.1:5432/portal_fumep_test
      POSTGRES_USER: portal_fumep
      POSTGRES_PASSWORD: portal_fumep
      POSTGRES_DB: portal_fumep_test
      REDIS_PASSWORD: ci-ephemeral-redis
      REDIS_URL: redis://:ci-ephemeral-redis@127.0.0.1:6379
      MINIO_ROOT_USER: ci-ephemeral-minio
      MINIO_ROOT_PASSWORD: ci-ephemeral-storage
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      APP_ORIGIN: http://localhost:3000

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portal_fumep
          POSTGRES_PASSWORD: portal_fumep
          POSTGRES_DB: portal_fumep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_fumep -d portal_fumep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Start ephemeral Redis and MinIO test dependencies
        run: docker compose -p portal-fumep-ci -f docker-compose.dev.yml up -d --wait --wait-timeout 120 redis minio

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm --filter @fumep/db db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Clean ephemeral test dependencies
        if: always()
        run: docker compose -p portal-fumep-ci -f docker-compose.dev.yml down --volumes
